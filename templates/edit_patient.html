<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Patient</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"></head>

</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-info mb-4">
        <div class="container">
            <span class="navbar-brand"><i class="bi bi-pencil-square"></i> Edit Patient</span>
            <a href="{{ url_for('view_patients') }}" class="btn btn-outline-light btn-sm">Back</a>
        </div>
    </nav>

    

    <div class="container" style="max-width: 500px;">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <div class="card shadow-sm">
            <div class="card-body">
                <h4 class="mb-4 text-center text-info">Update Details</h4>

                <form action="{{ url_for('edit_patient', id=patient.id) }}" method="POST">
                   
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" value="{{ patient.username }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="full_name" class="form-control" value="{{ patient.full_name }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Address</label>
                        <input type="text" name="address" class="form-control" value="{{ patient.address }}" required>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label">Pincode </label>
                        <input type="text" name="pincode" minlength="6" maxlength="6" class="form-control" value="{{patient.pincode}}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Contact</label>
                        <input type="text" name="contact" minlength="10" maxlength="10"  class="form-control" value="{{ patient.contact }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" value="{{ patient.password }}" required>
                    </div>

                   

                    <button type="submit" class="btn btn-info w-100">Save Changes</button>
                    
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
