<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Doctor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"></head>

</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-success mb-4">
        <div class="container">
            <span class="navbar-brand"><i class="bi bi-pencil-square"></i> Edit Doctor</span>
            <a href="{{ url_for('view_doctors') }}" class="btn btn-outline-light btn-sm">Back</a>
        </div>
    </nav>

    

    <div class="container" style="max-width: 500px;">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <div class="card shadow-sm">
            <div class="card-body">
                <h4 class="mb-4 text-center text-success">Update Details</h4>

                <form action="{{ url_for('edit_doctor', id=doctor.id) }}" method="POST">
                    
                    <div class="mb-3">
                        <label class="form-label">Doctor Name</label>
                        <input type="text" name="username" class="form-control" value="{{ doctor.username }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Department</label>
                        <select name="department_name" class="form-select" required>
                            <option value="" selected disabled>Select Department...</option>
                            {% for dept in departments %}
                                <option value="{{ dept.id }}" {% if dept.id == doctor.department_name %}selected{% endif %}>
                                    {{ dept.department_name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">New Password </label>
                        <input type="text" name="password" class="form-control" value="{{doctor.password}}">
                    </div>

                    <button type="submit" class="btn btn-success w-100">Save Changes</button>
                    
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
