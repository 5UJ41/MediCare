<!DOCTYPE html>
<html lang="en">
<head>
    <title>Manage Availability</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 800px;">
        <div class="card shadow">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Update Availability (Next 7 Days)</h5>
                <a href="{{ url_for('doctor_dashboard') }}" class="btn btn-outline-light btn-sm">Back</a>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Date</th>
                                    <th>Available?</th>
                                    <th>Start Time</th>
                                    <th>End Time</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for day in dates %}
                                {% set day_str = day.strftime('%Y-%m-%d') %}
                                {% set avail = avail_map.get(day) %}
                                <tr>
                                    <td class="fw-bold">{{ day.strftime('%a, %d %b') }}</td>
                                    <td>
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" 
                                                   name="available_{{ day_str }}" 
                                                   {% if avail and avail.is_available %}checked{% endif %}>
                                        </div>
                                    </td>
                                    <td>
                                        <input type="time" class="form-control" name="start_time_{{ day_str }}" 
                                               value="{{ avail.start_time.strftime('%H:%M') if avail else '09:00' }}">
                                    </td>
                                    <td>
                                        <input type="time" class="form-control" name="end_time_{{ day_str }}" 
                                               value="{{ avail.end_time.strftime('%H:%M') if avail else '17:00' }}">
                                    </td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Save Schedule</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
