<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration | Hospital Management System</title>
    
    
    <link rel="icon" href="data:,">

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
<style>
    body {
        background-color: #f0f2f5;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    /* Stronger specificity for the border */
    .container .card.signup-card {
        border-top: 5px solid #005A9C !important;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1) !important;
        border-radius: 0.375rem;
    }
    
    .signup-card .card-title {
        color: #005A9C;
    }
    
    .btn-hospital {
        background-color: #005A9C;
        border-color: #005A9C;
        color: white;
    }
    
    .btn-hospital:hover {
        background-color: #00477a;
        border-color: #00477a;
        color: white;
    }
    
    .footer-link a {
        color: #005A9C;
        text-decoration: none;
        font-weight: bold;
    }
    
    .footer-link a:hover {
        text-decoration: underline;
    }
    
    .form-label {
        color: #333;
    }
</style>

</head>
<body>

    <div class="container" style="max-width: 500px;">
        
        <div class="card signup-card border-0 my-5">
            <div class="card-body p-4 p-md-5">
                <span style:background="red"> </span>
                <h3 class="card-title text-center mb-2 fw-bold">Patient Registration</h3>
                <p class="text-center text-muted mb-4 small">Create your hospital account</p>
                
                
                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    {% for category, message in messages %}
                      <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                      </div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                
                <form method="POST" action="/signup">
                    
                    <div class="mb-3">
                        <label for="username" class="form-label fw-bold">Username</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Choose a username" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label fw-bold">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Create a password" required>
                    </div>

                    <div class="mb-3">
                        <label for="full_name" class="form-label fw-bold">Full Name</label>
                        <input type="text" class="form-control" id="full_name" name="full_name" placeholder="e.g. John Doe" required>
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label fw-bold">Address</label>
                        <input type="text" class="form-control" id="address" name="address" placeholder="e.g. 123 Main St, City" required>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label for="pincode" class="form-label fw-bold">Pincode</label>
                            <input type="text" maxlength="6" minlength="6" class="form-control" id="pincode" name="pincode" placeholder="Enter pincode" required>
                        </div>
                        <div class="col-md-6">
                            <label for="contact" class="form-label fw-bold">Contact</label>
                            <input type="text" maxlength="10" minlength="10" class="form-control" id="contact" name="contact" placeholder="Enter phone number" required>
                        </div>
                    </div>
                    
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-hospital btn-lg">Register</button>
                    </div>

                </form>

                <div class="footer-link text-center mt-4">
                    <p class="text-muted small mb-0">
                        Already have an account? <a href="{{ url_for('login') }}">Log in here</a>
                    </p>
                </div>

            </div>
        </div>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
