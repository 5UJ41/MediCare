<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Hospital Management System</title>
    
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-card {
            border-top: 5px solid #005A9C;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        
        .card-title {
            color: #005A9C;
        }
        
        .btn-primary {
            background-color: #005A9C;
            border-color: #005A9C;
        }
        
        .btn-primary:hover {
            background-color: #00477a;
            border-color: #00477a;
        }
        
        .footer-link a {
            color: #005A9C;
            text-decoration: none;
            font-weight: bold;
        }
        
        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card login-card">
                    <div class="card-body p-4">
                        <h3 class="card-title text-center mb-2">Hospital Login</h3>
                        <p class="text-center text-muted mb-4">Access your hospital account.</p>
                        
                        
                        {% with messages = get_flashed_messages(with_categories=true) %}
                          {% if messages %}
                            {% for category, message in messages %}
                              <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                              </div>
                            {% endfor %}
                          {% endif %}
                        {% endwith %}

                        
                        <form method="POST" action="{{ url_for('login') }}">
                            
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" name="username" placeholder="Enter your Username" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Enter your Password" required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 mt-3">Log In</button>
                            
                        </form>
                        
                        <div class="footer-link text-center mt-4">
                            <p class="mb-0">New Patient? <a href="{{ url_for('signup') }}">Register Here</a></p>
                        </div>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
